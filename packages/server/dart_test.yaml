tags:
  pg:
    description: Requires a live Postgres instance (local dev / compose).
  mr:
    description: >-
      Also reaches the MeritRank service, which is a single shared container:
      every disposable database's pgmer2 talks to the same instance, so these
      tests can see each other's graph state. Run them with `-j 1`, separately
      from the rest of the pg suite. Some reach it indirectly — `public.graph`,
      `person_visibility_peers` and friends call `mr_*` internally.
  multi-connection:
    description: >-
      Deliberately sizes its own pool above one connection (overlap, admission
      and sizing tests). Excluded from the pool-size-1 CI run, which sets
      `TENTURA_TEST_PG_POOL_SIZE=1`; run it separately with the normal pool.
  perf:
    description: >-
      Perf recorder and fixtures (issue #235 U41). Timings come from a real
      MeritRank service, so these suites are tagged `pg` and `mr` as well:
      they stay out of the default run and the plain pg run, and run
      serialised (`-j 1`) like every `mr` suite. Select with `--tags perf`.
  load:
    description: >-
      D8 load suite (publication burst at 1,000 sessions). It outlasts the
      whole-suite wrapper timeout of the routine `mr` run, so that run
      excludes it (`--exclude-tags load`); select it on its own with
      `--tags load` as a perf-only measurement.
  toolchain:
    description: >-
      Re-runs the real analyzer gates (check-analyze-baseline.sh,
      check-custom-lints.sh) against the checkout. CI runs those gates
      directly through scripts/check-analysis.sh, so the Pipeline excludes
      this tag instead of analysing every package a second time.
  repo-files:
    description: >-
      Reads files outside packages/server (docs/contracts, scripts, workflows,
      hasura metadata, packages/client, ...). The Pipeline runs only this tag
      when a push changes such files but not packages/server itself;
      test/architecture/repo_files_tag_test.dart keeps the tagging honest.
