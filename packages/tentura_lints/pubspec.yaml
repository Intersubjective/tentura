name: tentura_lints
description: Project-specific analyzer plugin rules for Tentura.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # Stay on the analyzer 13.x line (Dart 3.13). Plugin 0.3.19+ pins analyzer 14,
  # which freezed 4.0.0-dev / drift_dev 2.34.5 do not allow yet (^13.0.0 only).
  analysis_server_plugin: '>=0.3.15 <0.3.19'
  analyzer: ^13.0.0

dev_dependencies:
  analyzer_testing: ^0.3.2
  test: ^1.31.0
  test_reflective_loader: ^0.4.0

plugin:
  platforms:
    dart:
      pluginClass: TenturaLintsPlugin
      fileName: main.dart
