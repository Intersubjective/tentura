fragment PostSummaryFields on v2_PostSummary {
  id
  authorId
  authorName
  authorAvatar
  forwardedByName
  rootImageUrl
  rootExcerpt
  lastMessageExcerpt
  lastMessageIsRoot
  lastMessageAt
  lastActivityAt
  pinnedAt
  mutedUntil
  mutedForever
  unreadCount
  participantCount
  notOpenedCount
  myDeclinedForwardCount
  previewParticipants {
    id
    displayName
    avatar
  }
  isAuthor
  status
  expiresAt
}
