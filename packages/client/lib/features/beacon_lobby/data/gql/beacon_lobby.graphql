# Request Questions (internally the lobby; server: BeaconLobby, item-thread
# scope kind 7, access policy `questions_access_levels`).
query BeaconLobby($beaconId: String!) {
  BeaconLobby(beaconId: $beaconId) {
    beaconId
    lobbyId
    isAuthor
    authorId
    canPost
    readOnlyReason
    banned {
      userId
      title
    }
  }
}

# The viewer's own standing, for the entry row (never creates the scope).
query BeaconLobbyAccess($beaconId: String!) {
  BeaconLobbyAccess(beaconId: $beaconId) {
    beaconId
    canRead
    canPost
    messageCount
    readOnlyReason
  }
}

# Newest page first (server limit 50); `beforeIso` pages back.
query BeaconLobbyMessages($beaconId: String!, $lobbyId: String!, $beforeIso: String) {
  RoomMessageList(beaconId: $beaconId, threadItemId: $lobbyId, beforeIso: $beforeIso) {
    id
    authorId
    authorTitle
    body
    createdAt
  }
}

mutation BeaconLobbyPost($beaconId: String!, $lobbyId: String!, $body: String!) {
  RoomMessageCreate(beaconId: $beaconId, body: $body, threadItemId: $lobbyId) {
    id
  }
}

mutation BeaconLobbyMarkSeen($beaconId: String!, $lobbyId: String!) {
  MarkThreadSeen(beaconId: $beaconId, threadId: $lobbyId) {
    beaconId
  }
}

mutation BeaconLobbyBan($beaconId: String!, $userId: String!) {
  BeaconLobbyBan(beaconId: $beaconId, userId: $userId)
}

mutation BeaconLobbyUnban($beaconId: String!, $userId: String!) {
  BeaconLobbyUnban(beaconId: $beaconId, userId: $userId)
}
