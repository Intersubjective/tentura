# import '/features/beacon/data/gql/beacon_model_with_admitted_helpers.graphql'
# import '/data/gql/user_model.graphql'

fragment BeaconModelWithHelpOfferUsers on beacon {
  ...BeaconModelWithAdmittedHelpers
  kind
  forward_policy
  last_activity_at
  post_root_message_id
  viewer_can_forward
  help_offers(
    where: { status: { _eq: 0 } }
    order_by: { updated_at: desc }
    # Every pending offer row on a My Work card names its person; at 3 the
    # fourth offerer fell back to an anonymous "Help offered" (UI review).
    limit: 12
  ) {
    user {
      ...UserModel
    }
  }
}
