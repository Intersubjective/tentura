# import '/data/gql/image_model_v2.graphql'

query MutualFriendsFetch($id: String!) {
  mutualFriends(id: $id) {
    id
    displayName
    trusts_viewer
    is_mutual_friend
    image {
      ...ImageModelV2
    }
    scores {
      src_score
      dst_score
    }
    user_presence {
      status
      last_seen_at
    }
    user_availability {
      is_limited
      resume_on
    }
  }
}
