mutation BeaconCreate(
  $title: String!,
  $context: String = "",
  $description: String = "",
  $coordinates: v2_Coordinates = {},
  $startAt: String = "",
  $endAt: String = "",
  $image: v2_Upload = {},
  $tags: String = "",
  $needs: String,
  $primaryNeedSlug: String,
  $addressLabel: String,
  $draft: Boolean
) {
  beaconCreate(
    title: $title,
    description: $description,
    coordinates: $coordinates,
    context: $context,
    startAt: $startAt,
    endAt: $endAt,
    image: $image,
    tags: $tags,
    needs: $needs,
    primaryNeedSlug: $primaryNeedSlug,
    addressLabel: $addressLabel,
    draft: $draft
  ) {
    id
  }
}
