mutation PostPublish(
  $id: String!
  $body: String!
  $mentionUserIds: [String!]
  $mentionOffsets: [Int!]
  $mentionLengths: [Int!]
  $recipientIds: [String!]
  $notes: String
  $forwardPolicy: Int!
  $lifetimeHours: Int
  ) {
    postPublish(
      id: $id
      body: $body
      mentionUserIds: $mentionUserIds
      mentionOffsets: $mentionOffsets
      mentionLengths: $mentionLengths
      recipientIds: $recipientIds
      notes: $notes
      forwardPolicy: $forwardPolicy
      lifetimeHours: $lifetimeHours
    ) {
      beaconId
      rootMessageId
      expiresAt
    }
  }
