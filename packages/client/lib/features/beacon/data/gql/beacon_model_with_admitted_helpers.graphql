# import '/data/gql/beacon_model.graphql'
# import '/data/gql/user_model.graphql'

fragment BeaconModelWithAdmittedHelpers on beacon {
  ...BeaconModel
  post_lifetime_hours
  post_draft_attachments(order_by: {position: asc}) {
    id
    kind
    file_name
    mime
    image { id author_id }
  }
  kind
  forward_policy
  last_activity_at
  post_root_message_id
  viewer_can_forward
  admitted_helpers(order_by: { user_id: asc }, limit: 3) {
    user {
      ...UserModel
    }
  }
  # admitted_helpers_aggregate comes from ...BeaconModel (B075).
}
