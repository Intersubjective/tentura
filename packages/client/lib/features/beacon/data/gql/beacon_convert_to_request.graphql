mutation BeaconConvertToRequest(
  $id: String!
  $title: String!
  $description: String
  $needs: String
  $primaryNeedSlug: String
  $startAt: String
  $endAt: String
  $isDiscoverable: Boolean
  $helperIds: [String!]! = []
) {
  beaconConvertToRequest(
    id: $id
    title: $title
    description: $description
    needs: $needs
    primaryNeedSlug: $primaryNeedSlug
    startAt: $startAt
    endAt: $endAt
    isDiscoverable: $isDiscoverable
    helperIds: $helperIds
  ) {
    id
  }
}
