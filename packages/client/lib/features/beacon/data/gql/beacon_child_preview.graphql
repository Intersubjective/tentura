query BeaconChildPreview($beaconId: String!) {
  beaconChildPreview(beaconId: $beaconId) {
    beaconId
    title
    description
    status
    publishedAt
    statusChangedAt
    isTombstone
    coverSource
    coverImageId
    coverThumbImageId
    primaryNeedSlug
    needs
    admittedHelperCount
    owner {
      id
      displayName
      avatarImageId
    }
    admittedHelperPreviews {
      id
      displayName
      avatarImageId
    }
  }
}
