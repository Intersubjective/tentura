query BeaconChildren(
  $parentBeaconId: String!,
  $group: String!,
  $first: Int,
  $after: String
) {
  beaconChildren(
    parentBeaconId: $parentBeaconId,
    group: $group,
    first: $first,
    after: $after
  ) {
    nextCursor
    summaries {
      beaconId
      title
      description
      status
      publishedAt
      statusChangedAt
      isTombstone
      coverSource
      coverImageId
      coverThumbImageId
      primaryNeedSlug
      needs
      admittedHelperCount
      owner {
        id
        displayName
        avatarImageId
      }
      admittedHelperPreviews {
        id
        displayName
        avatarImageId
      }
    }
  }
}
