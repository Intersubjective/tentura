fragment InvitationRow on invitation {
  id
  beacon_id
  invited_id
  addressee_name
  invite_origin
  accepted_at
  created_at
  updated_at
  beacon {
    title
  }
  invited {
    display_name
    image_id
  }
}

query InvitationsFetchByUserId(
  $pending_offset: Int = 0,
  $pending_limit: Int = 10,
  $accepted_offset: Int = 0,
  $accepted_limit: Int = 10,
  $created_at_gt: timestamptz!
) {
  pending: invitation(
    where: {
      _and: {
        invited_id: {_is_null: true},
        created_at: {_gt: $created_at_gt}
      }
    },
    order_by: {created_at: asc},
    offset: $pending_offset,
    limit: $pending_limit
  ) {
    ...InvitationRow
  }
  accepted: invitation(
    where: {
      invited_id: {_is_null: false}
    },
    order_by: {accepted_at: desc},
    offset: $accepted_offset,
    limit: $accepted_limit
  ) {
    ...InvitationRow
  }
  pending_count: invitation_aggregate(
    where: {
      _and: {
        invited_id: {_is_null: true},
        created_at: {_gt: $created_at_gt}
      }
    }
  ) {
    aggregate {
      count
    }
  }
}
