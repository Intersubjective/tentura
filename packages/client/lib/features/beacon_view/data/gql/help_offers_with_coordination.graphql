# import '/data/gql/image_model_v2.graphql'

query HelpOffersWithCoordination($beaconId: String!) {
  helpOffersWithCoordination(id: $beaconId) {
    beaconId
    userId
    message
    helpType
    status
    withdrawReason
    createdAt
    updatedAt
    responseType
    responseUpdatedAt
    responseAuthorUserId
    roomAccess
    admissionAction
    lastDeclineReason
    lastRemoveReason
    offerKind
    stakeState
    isDirectAuthorForward
    user {
      id
      displayName
      description
      my_vote
      trusts_viewer
      is_mutual_friend
      image {
        ...ImageModelV2
      }
      user_presence {
        last_seen_at
        status
      }
    }
  }
}
