mutation PersonTagCreate($name: String!, $glyph: String, $color: Int, $fromAutoKind: Int, $clientOpId: String!) {
  personTagCreate(name: $name, glyph: $glyph, color: $color, fromAutoKind: $fromAutoKind, clientOpId: $clientOpId) {
    id
    name
    glyph
    color
    ord
    count
    countOffField
  }
}
