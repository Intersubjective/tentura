#import 'attention_receipt_fields.graphql'

query ActivityOffersV2($cursor: String, $limit: Int, $beaconId: String) {
  activityOffers(cursor: $cursor, limit: $limit, beaconId: $beaconId) {
    totalCount
    nextCursor
    items {
      beaconId
      listPositionAt
      effectiveActivityAt
      latestForwardAt
      unseen
      eventTotal
      eventUnseenCount
      inviteId
      declinedInvite
      eventsPreview {
        ...AttentionReceiptFields
      }
    }
  }
}
