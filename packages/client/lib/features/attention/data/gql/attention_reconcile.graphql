mutation AttentionReconcile {
  attentionReconcile {
    createdObligationCount
    settledObligationCount
    unrepairableObligationCount
    summary {
      activityUnreadTotal
      myWorkUnreadTotal
      needsYouTotal
      myDeskDot
      myDeskCount
      forYouDot
      forYouSweepEligible
    }
  }
}
