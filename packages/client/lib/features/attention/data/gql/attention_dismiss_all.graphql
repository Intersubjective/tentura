mutation AttentionDismissAll(
  $operationId: String!
  $maxBatches: Int
  $includeOutcomes: Boolean
) {
  attentionDismissAll(
    operationId: $operationId
    maxBatches: $maxBatches
    includeOutcomes: $includeOutcomes
  ) {
    operationId
    appliedReceiptIds
    appliedOutcomeBeaconIds
    appliedCount
    skipped { kind id reason }
    failed { kind id reason }
    pendingCount
    status
    undoToken
    undoDeadline
  }
}
