#import 'attention_receipt_fields.graphql'

query AttentionFeed($view: String!, $cursor: String, $search: String, $limit: Int, $surface: String) {
  attentionFeed(view: $view, cursor: $cursor, search: $search, limit: $limit, surface: $surface) {
    summary { unreadTotal needsYouTotal }
    page {
      nextCursor
      items {
        ...AttentionReceiptFields
        eventsPreview {
          ...AttentionReceiptFields
        }
      }
    }
  }
}
