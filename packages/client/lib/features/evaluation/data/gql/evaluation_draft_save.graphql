mutation EvaluationDraftSave(
  $id: String!
  $evaluatedUserId: String!
  $value: Int!
  # Nullable on purpose: omission preserves legacy reasons; [] clears them.
  $reasonTags: [String!]
  $note: String
) {
  evaluationDraftSave(
    id: $id
    evaluatedUserId: $evaluatedUserId
    value: $value
    reasonTags: $reasonTags
    note: $note
  )
}
