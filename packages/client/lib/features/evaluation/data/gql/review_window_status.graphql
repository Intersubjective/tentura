query ReviewWindowStatus($id: String!) {
  reviewWindowStatus(id: $id) {
    beaconId
    hasWindow
    beaconTitle
    openedAt
    closesAt
    windowComplete
    userReviewStatus
    reviewedCount
    totalCount
    extensionsUsed
    canCloseNow
    canReopen
    sentAt
    requiredTotal
    requiredReviewed
    optionalTotal
    optionalReviewed
    viewerPackageOptional
    allRequiredSent
    sentReviewerCount
    unsentStartedPackages
  }
}
