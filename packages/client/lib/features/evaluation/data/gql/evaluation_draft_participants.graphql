query EvaluationDraftParticipants($id: String!) {
  evaluationDraftParticipants(id: $id) {
    userId
    displayName
    imageId
    role
    value
    reasonTags
    note
    promptVariant
    acknowledgedHelpTags
    acknowledgeableHelpTags
    maxAcknowledgedHelpTags
    isSubmitted
    isOptional
    rowStatus
    committedAt
    offerMessage
    forwarderDisplayName
  }
}
