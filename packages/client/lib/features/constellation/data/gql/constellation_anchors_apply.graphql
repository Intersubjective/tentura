mutation ConstellationAnchorsApply($ops: [v2_ConstellationAnchorOpInput!]!) {
  constellationAnchorsApply(ops: $ops) {
    beforeRevision
    afterRevision
    results {
      clientOpId
      status
      reason
      resultingTargetRevision
      anchor {
        targetKind
        targetId
        xUnits
        yUnits
        coordinateSpaceVersion
        revision
        placedAt
      }
      replayed
    }
  }
}
