# import '/data/gql/image_model_v2.graphql'

mutation ConstellationAnchorsApply(
  $ops: [v2_ConstellationAnchorOpInput!]!
  $showClosed: Boolean! = false
  $participatedOnly: Boolean! = false
) {
  constellationAnchorsApply(
    ops: $ops
    showClosed: $showClosed
    participatedOnly: $participatedOnly
  ) {
    beforeRevision
    afterRevision
    results {
      clientOpId
      status
      reason
      resultingTargetRevision
    }
    anchorProjection {
      revision
      anchors {
        targetKind
        targetId
        xUnits
        yUnits
        coordinateSpaceVersion
        revision
        placedAt
      }
      pinnedPeers {
        id
        displayName
        handle
        image {
          ...ImageModelV2
        }
      }
      pinnedRequests {
        id
        authorId
        title
        status
        needs
        primaryNeedSlug
        startAt
        endAt
        addressLabel
        hasCoordinates
        isMine
        viewerHasActiveHelpOffer
        viewerIsRoomParticipant
        viewerHasForwardEdge
        helpOfferCount
        coverSource
        coverThumb {
          ...ImageModelV2
        }
      }
      supportPeers {
        id
        displayName
        handle
        image {
          ...ImageModelV2
        }
      }
      supportEdges {
        src
        dst
        tier
      }
      serverFilteredBeaconIds
      serverFilteredBeaconCount
    }
  }
}
