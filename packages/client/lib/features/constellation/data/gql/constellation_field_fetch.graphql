# import '/data/gql/image_model_v2.graphql'

query ConstellationFieldFetch(
  $showClosed: Boolean! = false
  $participatedOnly: Boolean! = false
  $projection: v2_ConstellationProjection! = FULL
) {
  constellationField(
    showClosed: $showClosed
    participatedOnly: $participatedOnly
    projection: $projection
  ) {
    loadedAt
    context
    peersCapped
    requestsCapped
    directContactIds
    peers {
      id
      pinState
      contactOnly
      presence
      temporaryBeaconId
      bondContexts {
        beaconId
        title
      }
      displayName
      handle
      isNew
      image {
        ...ImageModelV2
      }
    }
    edges {
      src
      dst
      tier
    }
    requests {
      id
      pinState
      authorId
      title
      status
      needs
      primaryNeedSlug
      startAt
      endAt
      lastActivityAt
      addressLabel
      hasCoordinates
      isMine
      viewerHasActiveHelpOffer
      viewerIsRoomParticipant
      viewerHasForwardEdge
      forwardedById
      forwardedByName
      parentBeaconId
      helpOfferCount
      coverSource
      coverThumb {
        ...ImageModelV2
      }
      has_unread
    }
    posts {
      id
      authorId
      lastActivityAt
      expiresAt
      status
      rootExcerpt
      isPinned
      hiddenReachCount
      has_unread
    }
    memberWebs {
      beaconId
      personId
      state
    }
    anchorProjection {
      revision
      anchors {
        targetKind
        targetId
        xUnits
        yUnits
        coordinateSpaceVersion
        revision
        placedAt
      }
      pinnedPeers {
        id
        pinState
        visible
        presence
        temporaryBeaconId
        bondContexts {
          beaconId
          title
        }
        displayName
        handle
        isNew
        image {
          ...ImageModelV2
        }
      }
      pinnedRequests {
        id
        pinState
        authorId
        title
        status
        needs
        primaryNeedSlug
        startAt
        endAt
        lastActivityAt
        addressLabel
        hasCoordinates
        isMine
        viewerHasActiveHelpOffer
        viewerIsRoomParticipant
        viewerHasForwardEdge
        forwardedById
        forwardedByName
        parentBeaconId
        helpOfferCount
        coverSource
        coverThumb {
          ...ImageModelV2
        }
        has_unread
      }
      supportPeers {
        id
        displayName
        handle
        image {
          ...ImageModelV2
        }
      }
      supportEdges {
        src
        dst
        tier
      }
      serverFilteredBeaconIds
      serverFilteredBeaconCount
    }
  }
}
