# import '/data/gql/image_model_v2.graphql'

query ConstellationAnchorsFetch(
  $showClosed: Boolean! = false
  $participatedOnly: Boolean! = false
) {
  constellationField(
    showClosed: $showClosed
    participatedOnly: $participatedOnly
    projection: ANCHORS
  ) {
    loadedAt
    context
    peersCapped
    requestsCapped
    peers {
      id
      displayName
      handle
      image {
        ...ImageModelV2
      }
    }
    edges {
      src
      dst
      tier
    }
    requests {
      id
      authorId
      title
      status
      needs
      primaryNeedSlug
      startAt
      endAt
      addressLabel
      hasCoordinates
      isMine
      viewerHasActiveHelpOffer
      viewerIsRoomParticipant
      viewerHasForwardEdge
      helpOfferCount
      coverSource
      coverThumb {
        ...ImageModelV2
      }
    }
    anchorProjection {
      revision
      anchors {
        targetKind
        targetId
        xUnits
        yUnits
        coordinateSpaceVersion
        revision
        placedAt
      }
      pinnedPeers {
        id
        displayName
        handle
        image {
          ...ImageModelV2
        }
      }
      pinnedRequests {
        id
        authorId
        title
        status
        needs
        primaryNeedSlug
        startAt
        endAt
        addressLabel
        hasCoordinates
        isMine
        viewerHasActiveHelpOffer
        viewerIsRoomParticipant
        viewerHasForwardEdge
        helpOfferCount
        coverSource
        coverThumb {
          ...ImageModelV2
        }
      }
      supportPeers {
        id
        displayName
        handle
        image {
          ...ImageModelV2
        }
      }
      supportEdges {
        src
        dst
        tier
      }
      serverFilteredBeaconIds
      serverFilteredBeaconCount
    }
  }
}
