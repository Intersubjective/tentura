mutation PhantomCreateBatch(
  $rows: [v2_PhantomImportContactInput!]!
  $keepContacts: Boolean!
  $clientOpId: String!
) {
  phantomCreateBatch(rows: $rows, keepContacts: $keepContacts, clientOpId: $clientOpId) {
    created {
      rowIndex
      id
      alreadyOnTentura
    }
    refused {
      rowIndex
      message
    }
  }
}
