mutation ForwardBeacon(
  $beaconId: String!,
  $recipientIds: [String!]!,
  $note: String,
  $perRecipientNotes: String,
  $context: String,
  $parentEdgeId: String,
  $attributionParentEdgeIds: [String!],
  $reasons: [String!],
  $recipientReasons: [v2_ForwardRecipientReasonInput],
  $recipientBandProvenance: [v2_ForwardRecipientBandProvenanceInput]
) {
  beaconForward(
    id: $beaconId,
    recipientIds: $recipientIds,
    note: $note,
    perRecipientNotes: $perRecipientNotes,
    context: $context,
    parentEdgeId: $parentEdgeId,
    attributionParentEdgeIds: $attributionParentEdgeIds,
    reasons: $reasons,
    recipientReasons: $recipientReasons,
    recipientBandProvenance: $recipientBandProvenance
  ) {
    batchId
    deliveredRecipientIds
    availabilitySkippedRecipientIds
  }
}
