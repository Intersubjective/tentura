mutation RoomMessageCreate(
  $beaconId: String!
  $body: String!
  $replyToMessageId: String
  $threadItemId: String
  $file: v2_Upload = {}
  $explicitMentionUserIds: [String!]
  $explicitMentionOffsets: [Int!]
  $explicitMentionLengths: [Int!]
) {
  RoomMessageCreate(
    beaconId: $beaconId
    body: $body
    replyToMessageId: $replyToMessageId
    threadItemId: $threadItemId
    file: $file
    explicitMentionUserIds: $explicitMentionUserIds
    explicitMentionOffsets: $explicitMentionOffsets
    explicitMentionLengths: $explicitMentionLengths
  ) {
    id
  }
}
