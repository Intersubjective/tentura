mutation RoomMessageEdit($beaconId: String!, $messageId: String!, $body: String!, $explicitMentionUserIds: [String!], $explicitMentionOffsets: [Int!], $explicitMentionLengths: [Int!], $explicitMentionsProvided: Boolean) {
  RoomMessageEdit(beaconId: $beaconId, messageId: $messageId, body: $body, explicitMentionUserIds: $explicitMentionUserIds, explicitMentionOffsets: $explicitMentionOffsets, explicitMentionLengths: $explicitMentionLengths, explicitMentionsProvided: $explicitMentionsProvided)
}
