query BeaconThreadsList($beaconId: String!) {
  beaconThreads(beaconId: $beaconId) {
    threadId
    threadKind
    unreadCount
    messageCount
    lastSeenAt
    lastMessageAt
    lastMessageAuthorId
    lastMessagePreview {
      kind
      excerpt
      hasAttachment
      joinedUserId
      admissionReason
      linkedItemId
      linkedEventKind
      itemKind
      itemTitle
      pollTitle
      factTitle
      factVisibility
    }
  }
}
