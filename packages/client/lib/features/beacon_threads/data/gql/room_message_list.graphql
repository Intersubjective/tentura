# DORMANT(item-threads): threadItemId variable filters item-thread messages; always null in production.
# Rooms are General-only (guard: beacon_room_message_general_only_guard, DiscussionScopeDisabledException); thread_item_id is always NULL for new rows. Do not design for this path. See #192.
query RoomMessageList(
  $beaconId: String!
  $beforeIso: String
  $threadItemId: String
) {
  RoomMessageList(
    beaconId: $beaconId
    beforeIso: $beforeIso
    threadItemId: $threadItemId
  ) {
    id
    beaconId
    authorId
    body
    createdAt
    editedAt
    semanticMarker
    systemMessageKind
    linkedBlockerId
    linkedFactCardId
    linkedPollingId
    linkedItemId
    linkedEventKind
    linkedItemKind
    linkedItemStatus
    linkedItemTitle
    linkedItemBody
    linkedItemCreatorId
    linkedItemTargetPersonId
    linkedItemCreatedAt
    linkedItemUpdatedAt
    linkedItemLinkedMessageId
    linkedItemResolvedAt
    pollDataJson
    systemPayloadJson
    authorTitle
    authorHasPicture
    authorPicHeight
    authorPicWidth
    authorBlurHash
    authorImageId
    reactionsJson
    myReaction
    reactorsJson
    attachmentsJson
    mentions
    mentionSpansJson
    replyToAuthorId
    replyToAuthorTitle
    replyToBodyExcerpt
    replyToHasAttachments
    replyToMessageId
    threadItemId
  }
}
