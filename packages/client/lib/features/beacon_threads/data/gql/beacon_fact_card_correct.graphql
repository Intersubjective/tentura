mutation BeaconFactCardCorrect(
  $beaconId: String!
  $factCardId: String!
  $newText: String!
  $baseRevisionSeq: Int!
  $attachmentsJson: String
) {
  BeaconFactCardCorrect(
    beaconId: $beaconId
    factCardId: $factCardId
    newText: $newText
    baseRevisionSeq: $baseRevisionSeq
    attachmentsJson: $attachmentsJson
  )
}
