mutation RoomNowLineUpdate(
  $beaconId: String!
  $text: String!
  $baseRevision: Int!
) {
  BeaconRoomNowLineUpdate(
    beaconId: $beaconId
    text: $text
    baseRevision: $baseRevision
  ) {
    beaconId
    currentLine
    currentLineRevision
    openBlockerId
    openBlockerTitle
    lastRoomMeaningfulChange
    updatedAt
    updatedBy
  }
}
