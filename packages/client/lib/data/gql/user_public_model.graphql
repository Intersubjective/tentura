# import '/data/gql/image_model_v2.graphql'

# V2 remote-schema user projection (Hasura stitches server `user` → `v2_user`).
fragment UserPublicModel on v2_user {
  id
  displayName
  handle
  description
  my_vote
  trusts_viewer
  is_mutual_friend
  image {
    ...ImageModelV2
  }
  scores {
    src_score
    dst_score
  }
  user_presence {
    last_seen_at
    status
  }
  user_availability {
    is_limited
    resume_on
  }
}
