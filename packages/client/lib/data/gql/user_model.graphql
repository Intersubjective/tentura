# import '/data/gql/image_model.graphql'

fragment UserModel on user {
  id
  display_name
  handle
  description
  my_vote
  trusts_viewer
  is_mutual_friend
  image {
    ...ImageModel
  }
  scores {
    src_score
    dst_score
  }
  user_presence {
    last_seen_at
    status
  }
  user_availability {
    is_limited
    resume_on
  }
}
