# import '/data/gql/image_model.graphql'
# import '/data/gql/user_model.graphql'

fragment BeaconModel on beacon {
  id
  primary_need_slug
  cover_image_id
  cover_thumb_image_id
  cover_source
  cover_thumb_image {
    ...ImageModel
  }
  title
  description
  needs
  created_at
  updated_at
  is_pinned
  context
  status
  status_changed_at
  my_vote
  start_at
  end_at
  long
  lat
  address_label
  tags
  lineage_parent_beacon_id
  lineage_root_beacon_id
  beacon_images(order_by: {position: asc}) {
    image {
      ...ImageModel
    }
  }
  author {
    ...UserModel
  }
  help_offers_aggregate(where: { status: { _eq: 0 } }) {
    aggregate {
      count
    }
  }
  # Who holds an active offer; helpOfferCount counts each user once across
  # this list and participant_help_offers (an accepted regular offer has an
  # active row here and a committed participant row).
  active_help_offers: help_offers(where: { status: { _eq: 0 } }) {
    user_id
  }
  # Offers made through the participant path (BeaconParticipantOfferHelp) live
  # in beacon_participant, not beacon_help_offer; 1 = offered, 5 = committed.
  # Withdrawing or being removed keeps the status and only drops room_access
  # to 0 (none); 5 = left. Those participant rows must not be counted.
  # An author-removed helper's beacon_help_offer row is deactivated
  # (status 1, no withdraw_reason) and re-activated if they are let back in,
  # so help_offers_aggregate above counts only helpers who are still in.
  participant_help_offers: beacon_participants(
    where: { status: { _in: [1, 5] }, room_access: { _nin: [0, 5] } }
  ) {
    id
    user_id
  }
  unanswered_help_offers: help_offers_aggregate(
    # Unreviewed = active offer (status 0) with no coordination row (author has not responded).
    where: { status: { _eq: 0 }, _not: { coordination: {} } }
  ) {
    aggregate {
      count
    }
  }
  # B075: "Coordinating" starts with the first admitted (accepted) helper, so
  # every surface that derives the status needs this count.
  admitted_helpers_aggregate {
    aggregate {
      count
    }
  }
  can_read_content
  can_read_involvement
  can_read_admitted_helpers
  access_level
  access_reasons
  is_discoverable
  kind
  forward_policy
  last_activity_at
  post_root_message_id
  viewer_can_forward
}
