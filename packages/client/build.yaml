targets:
  $default:
    builders:

      # Neither generates anything here (no @GenerateMocks, no
      # @JsonSerializable; tests hand-write `extends Mock`), yet both re-ran
      # over every library a change reached: ~13 s of each incremental CI
      # codegen. Re-enable with generate_for when a file needs one.
      mockito:mockBuilder:
        enabled: false

      json_serializable:
        enabled: false

      # generate_for below keeps each builder off the libraries it can never
      # generate for, so a change re-runs far fewer builder steps (incremental
      # codegen roughly halves; the generated tree is byte-identical).
      # test/architecture/codegen_generate_for_coverage_test.dart fails when an
      # annotated file falls outside its builder's globs — widen the glob then.
      # An @injectable class outside them would otherwise be silently missing
      # from DI (a runtime failure only).
      drift_dev:
        generate_for:
          - lib/data/database/**
        options:
          databases:
            tentura: lib/data/database/database.dart
          named_parameters: true
          schema_dir: lib/data/database/schema/
          store_date_time_values_as_text: true

      injectable_generator:injectable_builder:
        generate_for:
          include:
            - lib/*.dart
            - lib/app/**
            - lib/data/**
            - lib/domain/**
            - lib/features/*/data/**
            - lib/features/*/domain/**
            - lib/features/*/ui/bloc/**
            - lib/ui/bloc/**
            - lib/ui/effect/**
          exclude:
            - lib/**/_g/**

      injectable_generator:injectable_config_builder:
        generate_for:
          - lib/app/di/di_current.dart

      auto_route_generator:auto_route_generator:
        generate_for:
          - lib/**_screen.dart

      auto_route_generator:auto_router_generator:
        generate_for:
          - lib/app/router/root_router.dart

      freezed:
        generate_for:
          include:
            - lib/data/service/remote_api_client/**
            - lib/domain/**
            - lib/features/*/domain/**
            - lib/features/*/ui/bloc/**
            - lib/ui/bloc/**
          exclude:
            - lib/**/_g/**
        options:
          equal: true
          copy_with: true
          format: false
          when: false
          map: false

      ferry_generator|graphql_builder:
        enabled: true
        options:
          schema: tentura|lib/data/gql/schema.graphql
          vars_create_factories: true
          output_dir: "_g"

          type_overrides:
            # Hasura's raw Postgres `date` scalar (used only for
            # user_availability.resume_on) is deliberately kept as the wire
            # String, not DateTime — see the serializer_builder note below on
            # why it can't share DateTime with `timestamptz`.
            date:
              name: String

            Date:
              name: DateTime

            v2_Date:
              name: DateTime

            timestamptz:
              name: DateTime

            v2_Upload:
              name: TenturaV2Upload
              import: 'package:tentura/data/gql/tentura_v2_upload.dart'

            smallint:
              name: int

            float8:
              name: double

            _text:
              name: String

            uuid:
              name: String

      ferry_generator|serializer_builder:
        enabled: true
        options:
          schema: tentura|lib/data/gql/schema.graphql
          output_dir: "_g"

          type_overrides:
            # `date` maps to String, not DateTime: built_value's Serializers
            # registry keys custom PrimitiveSerializers by Dart *type*, not
            # by GraphQL scalar name, so a second PrimitiveSerializer<DateTime>
            # (CalendarDateSerializer, below) would silently replace
            # TimestamptzSerializer for every `timestamptz` field in the app.
            # Callers that need the strict YYYY-MM-DD parse call
            # parseStrictUtcCalendarDateString on the raw wire string
            # themselves instead of relying on automatic deserialization.
            date:
              name: String

            Date:
              name: DateTime

            v2_Date:
              name: DateTime

            timestamptz:
              name: DateTime

            v2_Upload:
              name: TenturaV2Upload
              import: 'package:tentura/data/gql/tentura_v2_upload.dart'

            smallint:
              name: int

            float8:
              name: double

            _text:
              name: String

            uuid:
              name: String

          custom_serializers:
            - import: "package:tentura/data/gql/timestamptz_serializer.dart"
              name: TimestamptzSerializer

            - import: "package:tentura/data/gql/tentura_v2_upload_serializer.dart"
              name: TenturaV2UploadSerializer

            - import: "package:tentura/data/gql/float8_serializer.dart"
              name: Float8Serializer

            - import: "package:tentura/data/gql/smallint_serializer.dart"
              name: SmallintSerializer
