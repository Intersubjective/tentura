include:
  - package:bloc_lint/recommended.yaml
  - package:flutter_lints/flutter.yaml
  - package:very_good_analysis/analysis_options.yaml

# The analyzer resolves options from the *nearest* analysis_options.yaml, so the
# root `plugins:` block never reaches this package — it has to be declared here
# too. Keep the rule list in sync with the root analysis_options.yaml.
#
# NOTE: verify these rules with `dart analyze`, not `flutter analyze` —
# `flutter analyze` does not load analyzer plugins and reports no custom
# diagnostics at all, regardless of this block.
plugins:
  tentura_lints:
    path: ../tentura_lints
    diagnostics:
      no_domain_to_data_or_ui_import: true
      no_cubit_to_data_service_import: true
      no_map_dynamic_in_use_case_api: true
      no_raw_graphql_in_dart: true
      no_inline_font_size: true
      no_operational_raw_color: true
      no_operational_raw_text_style: true
      no_operational_pill_widgets_in_beacon_view: true
      no_raw_edge_insets: true
      no_raw_border_radius: true
      no_request_domain_entity: true
      use_tentura_top_bar: true
      cubit_requires_use_case_for_multi_repos: true

analyzer:
  errors:
    specify_nonobvious_property_types: ignore
  exclude:
    - "../../.pub-cache/**"
    - "**/*.gql.dart"
    - "**/*.gql.g.dart"
    - "**/*.freezed.dart"
    - "test/drift/**.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_relative_lib_imports: true
    directives_ordering: false
    sort_pub_dependencies: false
    public_member_api_docs: false
    sort_constructors_first: false
    always_use_package_imports: false
    lines_longer_than_80_chars: false
    avoid_catches_without_on_clauses: false
    avoid_positional_boolean_parameters: false

bloc:
  rules:
    - avoid_public_fields
    - avoid_flutter_imports
    - avoid_public_bloc_methods
    - prefer_void_public_cubit_methods
