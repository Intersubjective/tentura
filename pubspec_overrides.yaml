# lean_builder 1.2.x matches auto_route_generator 10.6 and analyzer 13 (Dart 3.13).
dependency_overrides:
  cli_util: ^0.5.0
  lean_builder: 1.2.2
  ferry_generator:
    path: packages/ferry_generator
  # Vendored 0.6.2 + render guards: skip nodes/edges whose layout position
  # hasn't been produced yet by the async relayout (see package README).
  force_directed_graphview:
    path: packages/force_directed_graphview
  # Tentura workaround for web_socket_client 0.2.1 (Sentry 2A–2D).
  # Remove packages/web_socket_client + this override when upstream merges+releases
  # https://github.com/felangel/web_socket_client/pull/87
  # AND channel stream onError / Object catch (our extra patches in that package).
  web_socket_client:
    path: packages/web_socket_client
  adaptive_number:
    git: https://github.com/alexandrim0/adaptive_number_dart.git
