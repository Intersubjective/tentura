name: Pipeline

on:
  push:
    branches:
      - main
  # PR mode: tests and analyzer only — no web build, server image or deploy,
  # and no pg shards unless the PR carries the `ci:full` label (see
  # pr-full-ci.yml, which reruns this workflow when the label is added). The
  # `PR checks` job is the required status on main.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      collect_coverage:
        description: Collect test coverage and upload lcov artifacts
        required: false
        default: false
        type: boolean
      run_realtime_multiclient:
        description: Run the five-pass simultaneous-browser realtime gate
        required: false
        default: false
        type: boolean

# main: one run at a time. A push that lands mid-run waits, and a newer push
# replaces a run that is still waiting. Nothing is cancelled mid-flight, so a
# deploy is never cut off; and because `changes` diffs against the last
# *successful* run, a replaced run's changes are covered by its replacement.
# PRs: a new push cancels the PR's running check (nothing there deploys).
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default: PR runs execute the PR's own scripts. Only the jobs
# that publish (build-web, build-server, deploy-dev) get packages: write, and
# none of them runs on a PR.
permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/intersubjective/tentura
  BUILDER_IMAGE: ghcr.io/intersubjective/tentura-builder

jobs:
  # Decides what this push needs (scripts/ci_changes.py): a package's tests,
  # analyzer gate and build run only when it changed; its `repo-files` tests
  # (the ones reading docs, scripts, workflows or the other package) also run
  # when anything outside it changed. Manual dispatch runs everything. On a PR
  # it diffs the PR (its merge commit against the base) and plans tests only.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: read
    outputs:
      server: ${{ steps.plan.outputs.server }}
      client: ${{ steps.plan.outputs.client }}
      web: ${{ steps.plan.outputs.web }}
      server_image: ${{ steps.plan.outputs.server_image }}
      deploy: ${{ steps.plan.outputs.deploy }}
      shards: ${{ steps.plan.outputs.shards }}
      server_key: ${{ steps.keys.outputs.server_key }}
      web_key: ${{ steps.keys.outputs.web_key }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      # Diff against the last green run, not the previous push: a failed,
      # cancelled or replaced run must not let its changes skip their tests.
      - name: Diff against the last successful run
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Labels are read live, not from the event: pr-full-ci.yml reruns
            # this run when `ci:full` is added, with the original payload. A
            # failed lookup fails the step (set -e) rather than reading as "no
            # label".
            labels=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
              --json labels --jq '.labels[].name')
            if grep -qx 'ci:full' <<<"$labels"; then
              echo "ci:full: running every test, pg shards included."
              python3 scripts/ci_changes.py --all > plan.txt
              echo "pg=true" >> "$GITHUB_OUTPUT"
            else
              # HEAD is the PR merged into its base: what would land.
              base="${{ github.event.pull_request.base.sha }}"
              git fetch --quiet --depth=1 origin "$base"
              echo "Changes in this PR (against $base):"
              git diff --name-only --no-renames "$base" HEAD | tee changed.txt
              python3 scripts/ci_changes.py < changed.txt > plan.txt
              echo "pg=false" >> "$GITHUB_OUTPUT"
            fi
            # Nothing is built for deployment or deployed from a PR.
            sed -i -e 's/^web=.*/web=false/' -e 's/^server_image=.*/server_image=false/' \
              -e 's/^deploy=.*/deploy=false/' plan.txt
          elif [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch: running everything."
            python3 scripts/ci_changes.py --all > plan.txt
            echo "pg=true" >> "$GITHUB_OUTPUT"
          else
            echo "pg=true" >> "$GITHUB_OUTPUT"
            # Push runs only: a PR run (even from a fork branch named main)
            # must never become main's baseline.
            base=$(gh run list --repo "${{ github.repository }}" --workflow pipeline.yml \
              --branch "${{ github.ref_name }}" --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
            if [ -n "$base" ] && git fetch --quiet --depth=1 origin "$base"; then
              echo "Changes since the last successful run ($base):"
              # --no-renames: a moved file counts at both its old and new path.
              git diff --name-only --no-renames "$base" HEAD | tee changed.txt
              python3 scripts/ci_changes.py < changed.txt > plan.txt
            else
              echo "No usable last successful run: running everything."
              python3 scripts/ci_changes.py --all > plan.txt
            fi
          fi
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"

      # Deployable artifacts are addressed by their inputs (git tree ids), not
      # by commit: a build from a run whose tests failed must never be what a
      # later run deploys just because it is the newest. deploy-dev ships the
      # server image and web archive built from exactly HEAD's inputs.
      - name: Content keys for the deployable artifacts
        id: keys
        run: |
          set -euo pipefail
          # Sources plus the recipe (workflow, actions, builder image, CI
          # scripts): reverting a failed run's script or workflow change must
          # not pick up the artifact that change produced.
          mapfile -t recipe < <(python3 scripts/ci_changes.py --ci-inputs)
          shared=(lib pubspec.yaml pubspec.lock pubspec_overrides.yaml "${recipe[@]}")
          server_key=$(git ls-tree -r HEAD packages/server "${shared[@]}" | sha256sum | cut -c1-20)
          web_key=$(git ls-tree -r HEAD packages/client packages/landing packages/ferry_generator \
            packages/force_directed_graphview packages/image_cropper_for_web \
            packages/web_socket_client "${shared[@]}" | sha256sum | cut -c1-20)
          echo "server_key=$server_key" | tee -a "$GITHUB_OUTPUT"
          echo "web_key=$web_key" | tee -a "$GITHUB_OUTPUT"

      # When deploying without rebuilding, the artifact for these inputs must
      # exist (a cache entry can be evicted; an image can predate this scheme).
      - name: Look up the web archive for these inputs
        id: webcache
        if: steps.diff.outputs.deploy == 'true' && steps.diff.outputs.web != 'true'
        uses: actions/cache/restore@v5
        with:
          path: web-build-output
          key: web-build-${{ steps.keys.outputs.web_key }}-${{ github.run_id }}
          restore-keys: web-build-${{ steps.keys.outputs.web_key }}-
          lookup-only: true

      - name: Look up the server image for these inputs
        id: srvimage
        if: steps.diff.outputs.deploy == 'true' && steps.diff.outputs.server_image != 'true'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "${{ env.IMAGE_NAME }}:srv-${{ steps.keys.outputs.server_key }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan jobs
        id: plan
        env:
          SERVER: ${{ steps.diff.outputs.server }}
          CLIENT: ${{ steps.diff.outputs.client }}
          WEB: ${{ steps.diff.outputs.web }}
          DEPLOY: ${{ steps.diff.outputs.deploy }}
          SERVER_CHANGED: ${{ steps.diff.outputs.server_image }}
          RUN_PG: ${{ steps.diff.outputs.pg }}
          CACHED_WEB: ${{ steps.webcache.outputs.cache-matched-key }}
          IMAGE_FOUND: ${{ steps.srvimage.outputs.found }}
          # Shard counts. Each shard's files come from
          # scripts/ci_select_tests.py --balance, packed by the measured
          # durations in scripts/ci_test_durations.json; any count works
          # (scripts/test_ci_select_tests.py checks 1-8). Mind the 20
          # concurrent jobs of the free plan: a full run has lints, server,
          # client-analyze and these shards, plus build-web/build-server.
          PG_SHARDS: 6
          CLIENT_SHARDS: 3
        run: |
          set -euo pipefail
          web="$WEB"
          if [ "$DEPLOY" = "true" ] && [ "$web" != "true" ] && [ -z "$CACHED_WEB" ]; then
            echo "No web archive cached for these client inputs: building one."
            web=true
          fi
          server_image="$SERVER_CHANGED"
          if [ "$DEPLOY" = "true" ] && [ "$server_image" != "true" ] && [ "$IMAGE_FOUND" != "true" ]; then
            echo "No server image pushed for these server inputs: building one."
            server_image=true
          fi
          shards='[{"target":"lints","package":""}'
          if [ "$SERVER" != "skip" ]; then
            shards+=',{"target":"server","package":"server"}'
            if [ "$RUN_PG" != "true" ]; then
              echo "pg shards skipped (PR without the ci:full label)."
            elif [ "$SERVER" = "full" ]; then
              # The pg suite is CPU-bound on one 4-vCPU runner; split by file
              # across PG_SHARDS runners, each with its own Postgres.
              for i in $(seq 1 "$PG_SHARDS"); do
                shards+=",{\"target\":\"pg-$i\",\"package\":\"server\",\"shard\":\"$i/$PG_SHARDS\"}"
              done
            else
              # A handful of repo-files pg tests: one runner is plenty.
              shards+=',{"target":"pg-1","package":"server","shard":"1/1"}'
            fi
          fi
          if [ "$CLIENT" = "full" ]; then
            # The analyzer gate on its own runner, next to the test shards
            # rather than before the tests of one of them.
            shards+=',{"target":"client-analyze","package":"client"}'
            for i in $(seq 1 "$CLIENT_SHARDS"); do
              shards+=",{\"target\":\"client-$i\",\"package\":\"client\",\"shard\":\"$i/$CLIENT_SHARDS\"}"
            done
          elif [ "$CLIENT" = "repo-files" ]; then
            shards+=',{"target":"client-1","package":"client","shard":"1/1"}'
          fi
          shards+=']'
          {
            echo "server=$SERVER"
            echo "client=$CLIENT"
            echo "web=$web"
            echo "server_image=$server_image"
            echo "deploy=$DEPLOY"
            echo "shards=$shards"
          } | tee -a "$GITHUB_OUTPUT"

  test-shards:
    name: test-${{ matrix.target }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must not cancel the others: with six targets one red
      # shard was hiding the verdict of the rest, and a run that reports one
      # failure out of six tells you less than it looks like it does.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      # full: everything; repo-files: only tests tagged `repo-files`.
      SERVER_MODE: ${{ needs.changes.outputs.server }}
      CLIENT_MODE: ${{ needs.changes.outputs.client }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      # Only the `pg-*` shards need a database, and each runs on its own runner,
      # so starting these here costs the other shards nothing.
      #
      # MeritRank is not optional even though the `mr`-tagged tests are
      # excluded: `public.graph`, `person_visibility_peers` and friends call
      # `mr_*` inside their bodies, so tests that never mention MeritRank still
      # reach it. Verified by stopping the service locally — 34 untagged tests
      # fail without it. The images and wiring mirror `compose.dev.yaml`.
      - name: Start Postgres and MeritRank for the pg shard
        if: startsWith(matrix.target, 'pg-')
        run: |
          set -euo pipefail
          docker network create tentura-ci
          docker run -d --name meritrank --network tentura-ci \
            --hostname meritrank \
            -e MERITRANK_SERVER_ADDRESS=0.0.0.0 \
            -e MERITRANK_SERVER_PORT=8080 \
            -e MERITRANK_NUM_WALKS=1000 \
            -e MERITRANK_ZERO_OPINION_FACTOR=0.02 \
            -e MERITRANK_ALPHA=0.85 \
            -e MERITRANK_WALKS_CACHE_SIZE=300 \
            -e MERITRANK_ON_DEMAND_NUM_WALKS=10000 \
            -e MERITRANK_SNAPSHOT_STALENESS=2 \
            vbulavintsev/meritrank-service:v0.12.0
          docker run -d --name tentura-pg --network tentura-ci \
            -e POSTGRES_PASSWORD=password \
            -e MERITRANK_SERVICE_URL=tcp://meritrank:8080 \
            -e MERITRANK_RECV_TIMEOUT_MSEC=10000 \
            -p 5432:5432 \
            vbulavintsev/postgres-tentura:v0.9.1
          for _ in $(seq 1 60); do
            if docker exec tentura-pg pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready" >&2
          docker logs tentura-pg >&2 || true
          docker logs meritrank >&2 || true
          exit 1

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      # build_runner's state is two things: its asset graph and hidden outputs
      # under .dart_tool/build, and the generated files it wrote into the
      # source tree (gitignored, so a fresh checkout has none). Restoring only
      # the first made every run rebuild all in-tree outputs (7185 written,
      # 163 s); scripts/ci_codegen.sh restores both, so only what the change
      # touches is rebuilt. Shared by every job that generates the package.
      # GitHub scopes caches by branch: a PR reads main's entries but writes
      # its own, so nothing a PR builds is ever restored on main. Restores fall
      # back only to entries from the same pubspec.lock: a graph from another
      # build_runner version may be unreadable, and then build_runner could
      # not delete the outputs it lists.
      - name: Restore codegen cache
        id: codegen-cache
        if: matrix.package != ''
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/${{ matrix.package }}/.dart_tool/build
            packages/${{ matrix.package }}/.dart_tool/ci-codegen-outputs.tar
          key: codegen-v2-${{ matrix.package }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles(format('packages/{0}/pubspec.yaml', matrix.package), format('packages/{0}/build.yaml', matrix.package), format('packages/{0}/lib/**', matrix.package), format('packages/{0}/test/**', matrix.package), format('packages/{0}/integration_test/**', matrix.package), format('packages/{0}/l10n/**', matrix.package)) }}
          restore-keys: codegen-v2-${{ matrix.package }}-${{ hashFiles('pubspec.lock') }}-

      # Its own step so the pull (~25 s on a fresh runner) is not booked as
      # codegen. Pulling in the background from the first step was tried and
      # dropped: it competed with the cache restores (32-36 s instead of
      # 22-26 s) and had the image ready no earlier.
      - name: Pull the builder image
        run: docker pull -q "${{ env.BUILDER_IMAGE }}:latest"

      # One job per package saves the cache (client-1, server); the others
      # would only race it for the same key.
      - name: Generate code in builder container
        if: matrix.package != ''
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            -v "${{ github.workspace }}/.pub-cache":/root/.pub-cache \
            --env CODEGEN_SAVE="${{ (matrix.target == 'client-1' || matrix.target == 'server') && steps.codegen-cache.outputs.cache-hit != 'true' }}" \
            ${{ env.BUILDER_IMAGE }}:latest \
            bash scripts/ci_codegen.sh "${{ matrix.package }}"

      # Saved right after codegen so a red test run still warms the cache.
      - name: Save codegen cache
        if: (matrix.target == 'client-1' || matrix.target == 'server') && steps.codegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            packages/${{ matrix.package }}/.dart_tool/build
            packages/${{ matrix.package }}/.dart_tool/ci-codegen-outputs.tar
          key: ${{ steps.codegen-cache.outputs.cache-primary-key }}

      - name: Run ${{ matrix.target }} checks in builder container
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          # pg-N and client-N run the `pg` / `client` target, each on its
          # shard of the files.
          case "$target" in
            pg-*) target=pg ;;
            client-[0-9]*) target=client ;;
          esac
          if [ "$target" = client ]; then
            bash scripts/test_resolve_deploy_web_config.sh
          fi
          network_args=()
          if [ "$target" = "pg" ]; then
            # share the runner's network so 127.0.0.1:5432 reaches the Postgres
            # container started above
            network_args+=(--network host)
          fi
          docker run --rm "${network_args[@]}" \
            -v "${{ github.workspace }}":/app -w /app \
            -v "${{ github.workspace }}/.pub-cache":/root/.pub-cache \
            --env TEST_TARGET="$target" \
            --env SHARD="${{ matrix.shard }}" \
            --env SHARD_NAME="${{ matrix.target }}" \
            --env SERVER_MODE \
            --env CLIENT_MODE \
            --env CI \
            --env GITHUB_ACTIONS \
            ${{ env.BUILDER_IMAGE }}:latest \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              # `dart test` exits 79 when a selection matches no test, which a
              # repo-files run may legitimately do.
              allow_empty() { "$@" || { s=$?; [ "$s" -eq 79 ] || return "$s"; echo "(no tests selected)"; }; }
              # JSON reports of the client and pg runs, uploaded below: the
              # source of scripts/ci_test_durations.json and of test counts
              # (scripts/ci_test_durations.py).
              reports=/app/test-reports
              mkdir -p "$reports"
              case "$TEST_TARGET" in
                lints)
                  dart pub get
                  python3 scripts/test_ci_changes.py
                  python3 scripts/test_ci_select_tests.py
                  python3 scripts/check_repo_files_tags.py
                  python3 scripts/check_cross_package_imports.py
                  bash scripts/check-user-facing-terminology.sh
                  bash scripts/check-doc-drift.sh
                  cd packages/tentura_lints
                  dart test
                  ;;
                server)
                  cd packages/server
                  if [ "$SERVER_MODE" = full ]; then
                    bash ../../scripts/check-analysis.sh packages/server
                    # `toolchain` re-runs the analyzer gates just run above.
                    # Bundled like the client shards (161 s -> 104 s on 4
                    # cores); pg-tagged files stay standalone and excluded.
                    entrypoints=$(python3 ../../scripts/gen_test_bundles.py . --chunks 4)
                    dart test --exclude-tags pg,toolchain $entrypoints
                    ! rg "package:tentura_server/data/repository" lib/domain
                    ! rg "package:tentura_server/data/(service|storage)/" lib/domain/use_case
                    ! rg "package:tentura_server/data/" lib/domain
                  else
                    # Listing the tagged files spares loading every suite.
                    repo_files=$(python3 ../../scripts/ci_select_tests.py test --tag repo-files)
                    allow_empty dart test --tags repo-files --exclude-tags pg,toolchain $repo_files
                  fi
                  ;;
                pg)
                  # The MeritRank-touching tests are excluded: that service is a
                  # single shared instance, so they must run serially (`-j 1`,
                  # 8m) and belong in a nightly, not on every push.
                  cd packages/server
                  # Most pg tests build their own disposable database, but some
                  # connect to the default one and expect it already migrated —
                  # true on a dev machine running the stack, false on a fresh
                  # runner, where it produced 55 `42P01 relation does not exist`
                  # failures. This works on an empty database only since the
                  # squash: the baseline sets `check_function_bodies = false`
                  # itself, so the `mr_*` references in function bodies no
                  # longer need the extension present at migrate time.
                  dart run bin/utils/run_migrations_once.dart
                  # Only the repo-files subset when packages/server is unchanged.
                  only=()
                  if [ "$SERVER_MODE" != full ]; then only=(--tags repo-files); fi
                  # Pool-size-1 mode: every disposable database gets one pooled
                  # connection and one admission slot, so a scope that
                  # re-enters its own lease hangs or fails here instead of
                  # using a spare connection. Tests that deliberately size
                  # their own pool carry `multi-connection` and run next, with
                  # the normal pool. They assert admission latency, waiter
                  # caps and RSS under overload, so they must not overlap
                  # each other: `-j 1`.
                  # This runner shard of the files that can hold pg tests,
                  # packed by measured duration, with the time of the
                  # multi-connection run booked on the last shard, which runs
                  # it below. Listing files also spares dart test loading all
                  # 600+ suites to discover test-level tags.
                  pg_files=$(python3 ../../scripts/ci_select_tests.py test --tag pg --shard "$SHARD" \
                    --balance pg --reserve-last multi-connection)
                  TENTURA_TEST_PG_POOL_SIZE=1 allow_empty dart test --tags pg "${only[@]}" --exclude-tags mr,multi-connection \
                    --file-reporter "json:$reports/pg--$SHARD_NAME.json" $pg_files
                  # On the last shard (or the only one). Loading every suite
                  # one by one to find these took 132 s of a 172 s run; list
                  # them instead.
                  if [ "${SHARD%%/*}" = "${SHARD##*/}" ]; then
                    multi_files=$(python3 ../../scripts/ci_select_tests.py test --tag multi-connection)
                    allow_empty dart test --tags multi-connection "${only[@]}" --exclude-tags mr -j 1 \
                      --file-reporter "json:$reports/multi-connection--$SHARD_NAME.json" $multi_files
                  fi
                  ;;
                client-analyze)
                  # The client analyzer gate (both gates, one analyzer pass).
                  # Its own job: it needs only the generated code, not the
                  # tests, and took ~100 s of a test shard before.
                  cd packages/client
                  bash ../../scripts/check-analysis.sh packages/client
                  ;;
                client)
                  # client-N: shard N of packages/client/test, packed by
                  # measured duration (scripts/ci_select_tests.py --balance;
                  # every *_test.dart lands on exactly one shard, so a new
                  # test file or directory needs nothing here). The l10n/arb
                  # checks run once, on the first shard. When only repo-files
                  # tests run, the single client-1 runs all of them.
                  if [ "${SHARD%%/*}" = 1 ]; then
                    python3 scripts/test_check_arb_duplicates.py
                    python3 scripts/check_arb_duplicates.py
                  fi
                  cd packages/client
                  if [ "$CLIENT_MODE" = full ]; then
                    shard_files=$(python3 ../../scripts/ci_select_tests.py test --shard "$SHARD" --balance client)
                    # Bundles: one compile + one flutter_tester per chunk of
                    # files instead of per file (scripts/gen_test_bundles.py),
                    # dealt by duration and started longest first. Two
                    # chunks: flutter test runs two suites at a time here, and
                    # each bundle costs ~20 s of compile.
                    entrypoints=$(python3 ../../scripts/gen_test_bundles.py . --chunks 2 --balance client $shard_files)
                    # The client runner has no Postgres: a client test tagged
                    # `pg` (it starts a server fixture) runs locally only.
                    flutter test --dart-define=ENV=test --dart-define-from-file=env/test.env --exclude-tags pg \
                      --file-reporter "json:$reports/client--$SHARD_NAME.json" $entrypoints
                  else
                    # Only the tagged files: flutter test pays ~1.5 s to load
                    # each file it is given, tagged or not.
                    repo_files=$(python3 ../../scripts/ci_select_tests.py test --tag repo-files)
                    flutter test --dart-define=ENV=test --dart-define-from-file=env/test.env --tags repo-files --exclude-tags pg \
                      --file-reporter "json:$reports/client--$SHARD_NAME.json" $repo_files
                  fi
                  ;;
                *)
                  echo "Unknown test target: $TEST_TARGET" >&2
                  exit 1
                  ;;
              esac
            '

      # Per-test timings for scripts/ci_test_durations.py. Named by attempt:
      # a rerun uploads alongside the first attempt's reports, not over them.
      - name: Upload test reports
        if: always() && (startsWith(matrix.target, 'pg-') || (startsWith(matrix.target, 'client-') && matrix.target != 'client-analyze'))
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-a${{ github.run_attempt }}-${{ matrix.target }}
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 14

  # The required status for merging into main. One stable name whatever the
  # PR touched: the shard matrix differs per PR, and a required check that a
  # run never creates would block the merge forever.
  pr-checks:
    name: PR checks
    needs: [changes, test-shards]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `always()`, not `!cancelled()`: a cancelled run must report failure,
      # since GitHub counts a skipped required check as passing.
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          echo "changes: $CHANGES, test shards: $SHARDS"
          if [ "$CHANGES" = "success" ] && [ "$SHARDS" = "success" ]; then
            exit 0
          fi
          echo "::error::PR checks failed (changes: $CHANGES, test shards: $SHARDS)"
          exit 1

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.collect_coverage == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Run tests with coverage in builder container
        run: |
          set -euo pipefail
          bash scripts/test_resolve_deploy_web_config.sh
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            -v "${{ github.workspace }}/.pub-cache":/root/.pub-cache \
            ${{ env.BUILDER_IMAGE }}:latest \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              dart pub get
              python3 scripts/check_arb_duplicates.py
              flutter pub get
              ( cd packages/tentura_lints && dart test ) &&
              bash scripts/check-user-facing-terminology.sh &&
              ( cd packages/server && dart run build_runner build -d && dart test --exclude-tags pg --coverage=coverage ) &&
              ( cd packages/client && flutter gen-l10n && dart run build_runner build -d && flutter test --dart-define=ENV=test --dart-define-from-file=env/test.env --coverage )
            '

      - name: Install lcov
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov

      - name: Filter lcov and write hand-written summary
        run: bash scripts/ci_coverage_report.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-coverage-lcov
          path: |
            packages/server/coverage/lcov.info
            packages/client/coverage/lcov.info
            packages/server/coverage/lcov.handwritten.info
            packages/client/coverage/lcov.handwritten.info
            coverage/lcov.handwritten.merged.info
            coverage/handwritten-summary.txt
          retention-days: 30

  realtime-multiclient:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_realtime_multiclient == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install browser-runner dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq caddy jq unzip

      - name: Configure local QA stack
        run: |
          set -euo pipefail
          cp .env.example .env
          printf '%s\n' \
            'QA_AUTH_ENABLED=true' \
            'QA_AUTH_TOKEN=ci-realtime-multiclient' \
            'QA_EMAIL_DOMAINS=test.tentura.local,qa.tentura.local,example.test' \
            'QA_SIMPLE_LOGIN_MODE=true' \
            'MIN_CLIENT_VERSION=0.0.0' >> .env

      - name: Resolve workspace dependencies
        run: |
          dart pub get
          flutter pub get

      - name: Run simultaneous-client realtime gate
        run: bash scripts/run_realtime_multiclient_web_local.sh

      - name: Upload realtime browser artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: realtime-multiclient
          path: reports/realtime-multiclient/
          if-no-files-found: warn
          retention-days: 14

  build-web:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Determine versions
        id: versions
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' packages/server/pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_CLEAN=${VERSION_LINE//+/-}
          VERSION_CLEAN=${VERSION_CLEAN//\//-}
          echo "server_version=$VERSION_CLEAN" >> "$GITHUB_OUTPUT"
          CLIENT_VERSION=$(grep '^version:' packages/client/pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          echo "client_version=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      # Same key as the client test shards; test-client-1 saves it (see
      # test-shards "Restore codegen cache").
      - name: Restore client codegen cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/client/.dart_tool/build
            packages/client/.dart_tool/ci-codegen-outputs.tar
          key: codegen-v2-client-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('packages/client/pubspec.yaml', 'packages/client/build.yaml', 'packages/client/lib/**', 'packages/client/test/**', 'packages/client/integration_test/**', 'packages/client/l10n/**') }}
          restore-keys: codegen-v2-client-${{ hashFiles('pubspec.lock') }}-

      # Multiline .env blob (FB_* dart-defines) — same format as packages/client/env/dev-web.env
      - name: Write client dart-define file
        env:
          CLIENT_DART_DEFINES: ${{ secrets.CLIENT_DART_DEFINES }}
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_DART_DEFINES}" ]; then
            echo "CLIENT_DART_DEFINES not set on dev environment; web build will omit Firebase dart-defines."
            exit 0
          fi
          printf '%s\n' "$CLIENT_DART_DEFINES" > .env
          bash scripts/validate_client_firebase_env.sh .env
          echo "Wrote .env for flutter --dart-define-from-file (Firebase client config)."

      # Required dev vars: CLIENT_SERVER_NAME, IMAGE_SERVER (single public origin).
      - name: Resolve deploy web config
        id: webcfg
        env:
          CLIENT_SERVER_NAME: ${{ vars.CLIENT_SERVER_NAME }}
          IMAGE_SERVER: ${{ vars.IMAGE_SERVER }}
        run: bash scripts/resolve_deploy_web_config.sh --github-output "$GITHUB_OUTPUT"

      # WASM app + landing on same origin (base-href /).
      # VPS .env SERVER_NAME = Caddy site hostname; CLIENT_SERVER_NAME = full public origin URL.
      - name: Build dev web in builder container
        env:
          CLIENT_SENTRY_DSN: ${{ vars.CLIENT_SENTRY_DSN }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            -v "${{ github.workspace }}/.pub-cache":/root/.pub-cache \
            --env SERVER_VERSION="${{ steps.versions.outputs.server_version }}" \
            --env CLIENT_VERSION="${{ steps.versions.outputs.client_version }}" \
            --env WEB_BUILD_ID="${{ github.sha }}" \
            --env BUILD_DATE="${BUILD_DATE}" \
            --env IMAGE_SERVER="${{ steps.webcfg.outputs.image_server }}" \
            --env CLIENT_SERVER_NAME="${{ steps.webcfg.outputs.client_server_name }}" \
            --env CLIENT_SENTRY_DSN="${CLIENT_SENTRY_DSN:-}" \
            ${{ env.BUILDER_IMAGE }}:latest \
            bash -c "
              set -euo pipefail
              git config --global --add safe.directory \"*\"
              python3 scripts/check_arb_duplicates.py
              bash scripts/ci_codegen.sh client
              cd packages/client
              SENTRY_RELEASE=\"tentura@\${CLIENT_VERSION}\"
              SENTRY_DIST=\"\${WEB_BUILD_ID}\"
              SENTRY_ENVIRONMENT=\"dev\"
              SENTRY_DART_DEFINES=\"--dart-define=SENTRY_ENVIRONMENT=\${SENTRY_ENVIRONMENT} --dart-define=SENTRY_RELEASE=\${SENTRY_RELEASE} --dart-define=SENTRY_DIST=\${SENTRY_DIST}\"
              if [ -n \"\${CLIENT_SENTRY_DSN:-}\" ]; then
                SENTRY_DART_DEFINES=\"\${SENTRY_DART_DEFINES} --dart-define=SENTRY_DSN=\${CLIENT_SENTRY_DSN}\"
              fi
              if [ -f /app/.env ]; then
                flutter build web \\
                  --profile \\
                  --wasm \\
                  --pwa-strategy=none \\
                  --source-maps \\
                  --base-href=/ \\
                  --dart-define-from-file=/app/.env \\
                  --dart-define=SERVER_NAME=\${CLIENT_SERVER_NAME} \\
                  --dart-define=NEED_INVITE_CODE=true \\
                  --dart-define=IMAGE_SERVER=\${IMAGE_SERVER} \\
                  --dart-define=BUILD_GIT_SHA=\${WEB_BUILD_ID} \\
                  --dart-define=BUILD_DATE=\${BUILD_DATE} \\
                  \${SENTRY_DART_DEFINES}
              else
                flutter build web \\
                  --profile \\
                  --wasm \\
                  --pwa-strategy=none \\
                  --source-maps \\
                  --base-href=/ \\
                  --dart-define=SERVER_NAME=\${CLIENT_SERVER_NAME} \\
                  --dart-define=NEED_INVITE_CODE=true \\
                  --dart-define=IMAGE_SERVER=\${IMAGE_SERVER} \\
                  --dart-define=BUILD_GIT_SHA=\${WEB_BUILD_ID} \\
                  --dart-define=BUILD_DATE=\${BUILD_DATE} \\
                  \${SENTRY_DART_DEFINES}
              fi
              dart run tool/apply_google_maps_web_key.dart
              # Trim dead-weight, then preload manifest + cache SW from FINISHED
              # build/web (the build hook ran too early on fresh checkouts).
              dart run tool/trim_web_deploy_artifact.dart
              dart run tool/apply_versioned_web_assets.dart
              dart run tool/generate_wasm_preload_artifacts.dart
              grep -q 'wasmPreload' build/web/wasm-preload-manifest.json
              python3 -c \"import json; m=json.load(open('build/web/wasm-preload-manifest.json')); assert 'preload' not in m\"
              python3 -c \"import json, pathlib; v=json.load(open('build/web/wasm-preload-manifest.json'))['version']; assert pathlib.Path(f'build/web/app-assets/{v}/main.dart.js').is_file()\"
              # Block deploy if index.html / manifest / preload manifest / SW
              # disagree on the cache-busting build version (stale-asset guard).
              dart run tool/verify_web_version_consistency.dart build/web
              cd build/web && tar -czf /app/web-dev-\${SERVER_VERSION}.tar.gz . && cd ../..
            "

      # Static landing at /invite/* on same origin — plain files, no build/npm.
      - name: Package static landing
        env:
          LANDING_SENTRY_DSN: ${{ vars.LANDING_SENTRY_DSN }}
          LANDING_GOOGLE_ENABLED: ${{ vars.LANDING_GOOGLE_ENABLED }}
          LANDING_QA_TEST_LOGIN: ${{ vars.LANDING_QA_TEST_LOGIN }}
        run: |
          set -euo pipefail
          if [ -n "${LANDING_SENTRY_DSN:-}" ]; then
            sed -i "s|sentryDsn: ''|sentryDsn: '${LANDING_SENTRY_DSN}'|" packages/landing/config.js
          fi
          sed -i "s|sentryEnvironment: ''|sentryEnvironment: 'dev'|" packages/landing/config.js
          sed -i "s|sentryRelease: ''|sentryRelease: 'landing@${{ steps.versions.outputs.server_version }}'|" packages/landing/config.js
          if [ "${LANDING_GOOGLE_ENABLED:-}" = "true" ]; then
            sed -i 's|googleEnabled: false|googleEnabled: true|' packages/landing/config.js
          fi
          if [ "${LANDING_QA_TEST_LOGIN:-true}" = "true" ]; then
            sed -i 's|qaTestLogin: false|qaTestLogin: true|' packages/landing/config.js
          fi
          tar -czf landing-dev-${{ steps.versions.outputs.server_version }}.tar.gz \
            -C packages/landing \
            index.html config.js config.local.js main.js app_preload.js bfcache.js browser_compatibility.js invite_entry.js preview.js webview.js analytics.js auth.js onboarding.js beacon_overlay.js styles.css

      - name: Test static landing
        run: node --test packages/landing/test/*.mjs

      - name: Upload web archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: web-archives
          path: |
            web-dev-*.tar.gz
            landing-dev-*.tar.gz
          retention-days: 7

      - name: Save web archive to cache
        run: |
          mkdir -p web-build-output
          cp web-dev-*.tar.gz web-build-output/web-dev.tar.gz
          cp landing-dev-*.tar.gz web-build-output/landing-dev.tar.gz

      # Keyed by the client inputs (see changes) plus the run: deploy-dev takes
      # this run's archive, or else the newest one built from identical inputs.
      - name: Cache web build for deploy
        uses: actions/cache/save@v5
        with:
          path: web-build-output
          key: web-build-${{ needs.changes.outputs.web_key }}-${{ github.run_id }}

  # The server binary is compiled in the builder image, next to a warm codegen
  # cache; the image itself is only the runtime layer (Dockerfile.runtime).
  # The old in-Docker build re-cloned Flutter (70 s), regenerated code without
  # a cache and spent ~2 min exporting a multi-GB layer cache to GHA.
  build-server:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.server_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Determine versions
        id: versions
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' packages/server/pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_CLEAN=${VERSION_LINE//+/-}
          VERSION_CLEAN=${VERSION_CLEAN//\//-}
          echo "server_version=$VERSION_CLEAN" >> "$GITHUB_OUTPUT"
          CLIENT_VERSION=$(grep '^version:' packages/client/pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          echo "client_version=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: .pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Restore server codegen cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/server/.dart_tool/build
            packages/server/.dart_tool/ci-codegen-outputs.tar
          key: codegen-v2-server-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('packages/server/pubspec.yaml', 'packages/server/build.yaml', 'packages/server/lib/**', 'packages/server/test/**', 'packages/server/integration_test/**', 'packages/server/l10n/**') }}
          restore-keys: codegen-v2-server-${{ hashFiles('pubspec.lock') }}-

      - name: Build server binary in builder container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            -v "${{ github.workspace }}/.pub-cache":/root/.pub-cache \
            ${{ env.BUILDER_IMAGE }}:latest \
            bash -c '
              set -euo pipefail
              bash scripts/ci_codegen.sh server
              cd packages/server
              dart build cli -t bin/tentura.dart -o bin/cli-build
            '

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the content tag: `latest` (what the VPS runs) and the version tag
      # move in deploy-dev, after every test shard passed.
      - name: Build and push server image
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_NAME }}:srv-${{ needs.changes.outputs.server_key }}"
          docker build \
            -f packages/server/Dockerfile.runtime \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg SERVER_VERSION="${{ steps.versions.outputs.server_version }}" \
            -t "$image" \
            packages/server/bin/cli-build/bundle
          docker push "$image"

      - name: Print version summary
        run: |
          {
            echo "### Versions built"
            echo "| Package | Version |"
            echo "|---------|---------|"
            echo "| Server  | ${{ steps.versions.outputs.server_version }} |"
            echo "| Client  | ${{ steps.versions.outputs.client_version }} |"
            echo ""
            echo "Client version gate default ships in the server image (\`packages/server/lib/env.dart\`)." \
                 "Override \`MIN_CLIENT_VERSION\` in the \`dev\` GitHub Environment or VPS \`.env\` only when needed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [changes, test-shards, build-web, build-server]
    # Skipped build jobs are fine: an unchanged client deploys the newest
    # cached web archive, an unchanged server keeps the image already on GHCR.
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.test-shards.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.build-web.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.build-server.result)
    permissions:
      contents: read
      packages: write
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      # This run's archive, or else the newest built from identical client
      # inputs; never one built from different inputs.
      - name: Restore web build from cache
        uses: actions/cache/restore@v5
        with:
          path: web-build-output
          key: web-build-${{ needs.changes.outputs.web_key }}-${{ github.run_id }}
          restore-keys: |
            web-build-${{ needs.changes.outputs.web_key }}-

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VPS pulls `latest`; point it (and the version tag) at the image
      # built from HEAD's server inputs, now that every shard passed.
      - name: Promote the server image
        run: |
          set -euo pipefail
          version_line=$(grep '^version:' packages/server/pubspec.yaml | sed 's/version:[[:space:]]*//')
          version=${version_line//+/-}
          version=${version//\//-}
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:"$version" \
            ${{ env.IMAGE_NAME }}:srv-${{ needs.changes.outputs.server_key }}

      - name: Prepare web archive for deploy
        id: archive-name
        run: |
          set -euo pipefail
          CACHED='web-build-output/web-dev.tar.gz'
          if [ ! -f "$CACHED" ]; then
            echo "Error: no web archive cached for these client inputs (web_key ${{ needs.changes.outputs.web_key }})." >&2
            exit 1
          fi
          cp "$CACHED" web-dev.tar.gz
          echo "archive_name=web-dev.tar.gz" >> "$GITHUB_OUTPUT"
          if [ -f web-build-output/landing-dev.tar.gz ]; then
            cp web-build-output/landing-dev.tar.gz landing-dev.tar.gz
            echo "landing_archive_name=landing-dev.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "landing_archive_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        id: setup-ssh
        uses: ./.github/actions/setup-ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy web archive
        uses: ./.github/actions/deploy-web-archive
        env:
          VPS_HOST: ${{ steps.setup-ssh.outputs.vps-host }}
        with:
          archive-name: ${{ steps.archive-name.outputs.archive_name }}
          landing-archive-name: ${{ steps.archive-name.outputs.landing_archive_name }}
